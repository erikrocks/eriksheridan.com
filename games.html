<title>Save State: your top 3 games by era</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E1DB; --surface:#F3F1ED; --ink:#1D2130; --muted:#5B6070; --line:#CBC7C0;
  --era:#E8762C;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#151925; --surface:#1F2433; --ink:#ECEAE5; --muted:#9BA1B3; --line:#333A4C; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#151925; --surface:#1F2433; --ink:#ECEAE5; --muted:#9BA1B3; --line:#333A4C; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--body);color:var(--ink);background:color-mix(in srgb, var(--era) 9%, var(--bg));transition:background-color .35s ease;font-size:16px;line-height:1.45;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--era);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:.7rem 1rem .6rem;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;justify-content:space-between}
.logo{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:.45rem}
.logo i{width:.9rem;height:1.1rem;border-radius:3px 3px 1px 1px;background:var(--era);display:inline-block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:background .35s}
.modes{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.modes button{border:0;background:none;padding:.4rem .9rem;border-radius:999px;font-size:.9rem;font-weight:700;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.rail{max-width:1040px;margin:0 auto;display:flex;gap:.5rem;overflow-x:auto;padding:.9rem 1rem .2rem;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.cart{flex:0 0 auto;width:6.6rem;border:0;padding:0;background:none;text-align:left}
.cart .shell{display:block;height:4.2rem;border-radius:7px 7px 3px 3px;background:var(--surface);border:1px solid var(--line);position:relative;padding:.45rem .5rem;overflow:hidden;transition:transform .2s ease, background .2s}
.cart .shell::before{content:"";position:absolute;left:.5rem;right:.5rem;top:0;height:5px;border-radius:0 0 3px 3px;background:var(--c)}
.cart .shell::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 7px)}
.cart b{display:block;font-family:var(--display);font-weight:700;font-size:.92rem;line-height:1.1;margin-top:.35rem}
.cart small{display:block;color:var(--muted);font-size:.74rem;margin-top:.1rem}
.cart .dot{position:absolute;right:.45rem;top:.55rem;width:.5rem;height:.5rem;border-radius:50%;background:var(--c);opacity:0}
.cart.done .dot{opacity:1}
.cart[aria-selected="true"] .shell{background:var(--c);border-color:var(--c);color:#fff;transform:translateY(-4px);box-shadow:0 6px 0 -2px color-mix(in srgb,var(--c) 45%,transparent)}
.cart[aria-selected="true"] small{color:rgba(255,255,255,.85)}
.cart[aria-selected="true"] .shell::before,.cart[aria-selected="true"] .dot{background:#fff}

main{max-width:1040px;margin:0 auto;padding:1rem 1rem 7rem}
.era-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:.2rem 1rem;margin:.6rem 0 1rem}
.era-head h2{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,8vw,4rem);line-height:.95;letter-spacing:-.035em;margin:0;color:var(--era);transition:color .35s}
.era-head p{margin:0;color:var(--muted);max-width:42ch}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 .8rem;max-width:60ch}
h3.sub{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:1.4rem 0 .5rem}

/* contender picker */
.tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.7rem}
.search{flex:1 1 14rem;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.6rem .7rem}
.grid{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.4rem .6rem .4rem 1.9rem;line-height:1.2;position:relative;touch-action:manipulation;max-width:100%}
.chip::before{content:"";position:absolute;left:.55rem;top:50%;width:.95rem;height:.95rem;margin-top:-.48rem;border-radius:3px;border:2px solid var(--line);background:var(--bg)}
.chip[aria-pressed="true"]{border-color:var(--era);background:color-mix(in srgb,var(--era) 13%,var(--surface))}
.chip[aria-pressed="true"]::before{content:attr(data-rank);background:var(--era);border-color:var(--era);color:#fff;font-family:var(--display);font-weight:800;font-size:.72rem;line-height:.95rem;text-align:center;width:1.15rem;height:1.15rem;margin-top:-.58rem;left:.45rem;border:0}
.chip span{font-weight:700;font-size:.92rem}
.chip small{color:var(--muted);font-size:.74rem}
.chip.wi small{color:var(--era);font-weight:700}
.chip[hidden]{display:none}
.writein{display:flex;gap:.5rem;flex-wrap:wrap;margin:.2rem 0 0;padding:.7rem;border:1px dashed var(--line);border-radius:8px}
.writein input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.55rem .7rem}
.writein .t{flex:1 1 12rem}
.writein .y{width:6.2rem}
.go{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:3px solid var(--era);padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px))}
.go-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.go-in p{margin:0;font-size:.92rem}
.btn{border:0;border-radius:6px;padding:.65rem 1rem;font-weight:700;background:var(--era);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.linkish{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:.2rem;font-size:.88rem}

/* face-off */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:stretch;margin-top:.4rem}
.fight{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:1.1rem .9rem;text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-height:10rem;transition:border-color .15s, transform .1s}
.fight:hover{border-color:var(--era)}
.fight:active{transform:scale(.98)}
.fight b{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,4.6vw,1.7rem);line-height:1.05;letter-spacing:-.02em}
.fight small{color:var(--muted);margin-top:.6rem}
.fight .seat{font-size:.78rem;font-weight:700;color:var(--era);margin-top:.3rem}
.vs-mid{align-self:center;font-family:var(--display);font-weight:800;color:var(--era);font-size:1.2rem}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:1.1rem 0 .3rem}
.prog i{display:block;height:100%;background:var(--era);transition:width .25s}
.standing{display:flex;gap:.35rem;flex-wrap:wrap;margin:.3rem 0 0;padding:0;list-style:none;font-size:.85rem}
.standing li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem}

/* result */
.podium{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.podium li{display:grid;grid-template-columns:2.6rem 1fr auto;align-items:center;gap:.5rem;padding:.6rem;border-top:1px solid var(--line)}
.podium li:first-child{border-top:0;padding:1rem .6rem;background:color-mix(in srgb,var(--era) 12%,var(--surface))}
.rank{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--era);text-align:center;line-height:1}
.podium li:first-child .rank{font-size:2.6rem}
.podium b{display:block}
.podium li:first-child b{font-family:var(--display);font-size:1.6rem;letter-spacing:-.02em;line-height:1.05}
.podium small{color:var(--muted)}
.ctl{display:flex;gap:.25rem}
.ctl button{width:2.2rem;height:2.2rem;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.ctl button:disabled{opacity:.35;cursor:default}

/* slots */
.podium li.open{color:var(--muted)}
.podium li.open .rank{opacity:.3}
.podium li.open:first-child{background:none}
.podium li.open:first-child b{font-family:var(--body);font-size:1rem;font-weight:400}
.dock-slots{display:flex;gap:.35rem;flex:1;min-width:0}
.dock-slots span{flex:1;min-width:0;border-radius:5px;background:var(--bg);padding:.35rem .5rem;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-slots span.on{background:color-mix(in srgb,var(--era) 18%,var(--bg));font-weight:700}
.dock-slots i{font-style:normal;color:var(--era);font-weight:800;margin-right:.25rem}
/* summary grid */
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.7rem}
.card{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:8px;padding:.8rem .9rem 1rem}
.card .yrs{font-size:.8rem;color:var(--muted)}
.card .era-n{font-weight:700;color:var(--c)}
.card h3{margin:.35rem 0 .2rem;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;line-height:1.05}
.card h3 b{color:var(--c);margin-right:.35rem}
.card ol{list-style:none;margin:0;padding:0;font-size:.95rem}
.card ol b{color:var(--c);margin-right:.35rem}
.card .none{color:var(--muted);margin:.5rem 0}
.card.big{grid-column:1/-1;border-top-width:8px;padding:1rem 1.1rem 1.2rem}
.card.big h3{font-size:clamp(1.9rem,7vw,2.8rem)}
.card.big ol{font-size:1.1rem}
.card small{color:var(--muted);font-size:.8rem;margin-left:.3rem;font-weight:400;font-family:var(--body);letter-spacing:0}
/* lineup */
.line{position:relative;margin:0;padding:0 0 0 1.4rem;list-style:none}
.line::before{content:"";position:absolute;left:.42rem;top:.3rem;bottom:.3rem;width:3px;background:var(--line);border-radius:2px}
.line>li{position:relative;padding:.35rem 0 1.3rem}
.line>li::before{content:"";position:absolute;left:-1.25rem;top:.7rem;width:.85rem;height:.85rem;border-radius:3px;background:var(--c)}
.line .yrs{font-size:.8rem;color:var(--muted)}
.line .era-n{font-weight:700;color:var(--c)}
.line h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;line-height:1.1}
.rest{margin:.25rem 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.9rem;color:var(--muted)}
.rest b{color:var(--c);margin-right:.2rem}
textarea{width:100%;min-height:10rem;margin-top:.8rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:.6rem;font:inherit;font-size:.85rem}

.banner{margin:.9rem 0 0;padding:.6rem .8rem;border-left:4px solid var(--era);background:var(--surface);border-radius:0 6px 6px 0;font-size:.92rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(5rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);opacity:0;background:var(--ink);color:var(--surface);padding:.55rem 1rem;border-radius:999px;font-size:.9rem;z-index:9;transition:transform .2s,opacity .2s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:760px){.cart{width:7.6rem}}
</style>
</head>

  e.ids = e.list.trim().split("\n").map((ln,i) => {

  });
});

const KEY = "save-state-v3";
let S = {era:"arcade", mode:"rank", data:{}, custom:{}, allTime:[]};
let SHARED = false, MINE = null, warnedSave = false;
try {
  const raw = localStorage.getItem(KEY) || localStorage.getItem("save-state-v2");
  if (raw){ const o = JSON.parse(raw); S.era = o.era || S.era; S.custom = o.custom || {}; S.allTime = o.allTime || []; if (["rank","all","summary"].includes(o.mode)) S.mode = o.mode;
    for (const k in (o.data||{})) S.data[k] = {top:(o.data[k].top||[]).slice(0,3)}; }
} catch(e) {}
Object.values(S.custom).flat().forEach(g => GAME[g.id] = {t:g.t, y:g.y, p:"Write-in", wi:true});
const save = () => {
  if (SHARED) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ if (!warnedSave){ warnedSave = true; toast("Can’t save — your browser is blocking storage."); } }
};
const era = () => ERAS.find(e => e.id === S.era) || ERAS[0];
const D = (id = S.era) => S.data[id] || (S.data[id] = {top:[]});
const allIds = e => e.ids.concat((S.custom[e.id] || []).map(g => g.id));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const meta = g => g.wi ? (g.y ? g.y+", write-in" : "Write-in") : `${g.y}, ${esc(g.p)}`;
const isLast = () => era() === ERAS[ERAS.length-1];
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }

const ALL_C = "#9A6B1F";
const eraOf = id => ERAS.find(e => ((S.data[e.id]||{}).top||[]).includes(id));
const pool = () => ERAS.flatMap(e => (S.data[e.id]||{}).top || []);
const need = () => Math.min(3, pool().length);
const list = () => S.mode === "all" ? S.allTime : D().top;
const setList = v => { if (S.mode === "all") S.allTime = v; else D().top = v; };
const metaAll = id => { const g = GAME[id], e = eraOf(id); return `${g.y ? g.y + ", " : ""}${e ? e.name : ""}`; };

function renderRail(){
  $("#rail").innerHTML = ERAS.map(e => `
    <button class="cart ${(S.data[e.id]||{}).top?.length ? "done" : ""}" role="tab" aria-selected="${e.id === S.era}" data-era="${e.id}" style="--c:${e.c}">
      <span class="shell"><span class="dot"></span><b>${e.name}</b><small>${e.years}</small></span>
    </button>`).join("");
  const cur = $(".cart[aria-selected=true]"); if (cur) cur.scrollIntoView({block:"nearest", inline:"nearest"});
}

function slots(){
  const top = list(), all = S.mode === "all";
  return [0,1,2].map(i => {
    const id = top[i];
    if (!id) return `<li class="open"><span class="rank">${i+1}</span><span><b>Pick your${all ? " all-time" : ""} #${i+1}</b></span><span></span></li>`;
    const g = GAME[id];
    return `<li><span class="rank">${i+1}</span><span><b>${esc(g.t)}</b><small>${all ? metaAll(id) : meta(g)}</small></span>
    <span class="ctl"><button data-act="up" data-i="${i}" aria-label="Move ${esc(g.t)} up" ${i===0?"disabled":""}>↑</button><button data-act="down" data-i="${i}" aria-label="Move ${esc(g.t)} down" ${i===top.length-1?"disabled":""}>↓</button><button data-act="remove" data-i="${i}" aria-label="Remove ${esc(g.t)}">✕</button></span></li>`;
  }).join("");
}
function chipHtml(id, sub){
  const g = GAME[id], r = list().indexOf(id) + 1;
  return `<button class="chip ${g.wi?"wi":""}" data-pick="${id}" aria-pressed="${r>0}" data-rank="${r||""}"><span>${esc(g.t)}</span><small>${sub}</small></button>`;
}
function viewRank(){
  const e = era();
  const ids = allIds(e).slice().sort((a,b) => (GAME[a].y||9999) - (GAME[b].y||9999));
  return `<div class="era-head"><h2>${e.name}</h2><p>${e.years}. ${e.blurb}</p></div>
  <ol class="podium" id="slots">${slots()}</ol>
  <h3 class="sub">Choose your three</h3>
  <p class="hint">Tap games in order: first tap is #1. Tap a pick again to remove it.</p>
  <div class="tools"><input class="search" id="q" type="search" placeholder="Search ${ids.length} games" aria-label="Search games"></div>
  <div class="grid" id="grid">${ids.map(id => chipHtml(id, meta(GAME[id]))).join("")}</div>
  <h3 class="sub">Missing one?</h3>
  <form class="writein" id="wi">
    <input class="t" name="t" placeholder="Game title" aria-label="Game title" maxlength="80" required>
    <input class="y" name="y" placeholder="Year" aria-label="Year (optional)" inputmode="numeric" maxlength="4">
    <button class="btn" type="submit">Add write-in</button>
  </form>`;
}
function viewAll(){
  const p = pool();
  if (p.length < 2) return `<div class="era-head"><h2>All time</h2><p>The final cut, from your era picks.</p></div>
    <p class="hint">Rank at least two eras first. Your all-time top 3 can only come from the games you picked there.</p>
    <div class="row"><button class="btn" data-mode="rank">Rank eras</button></div>`;
  return `<div class="era-head"><h2>All time</h2><p>${p.length} finalists from ${ERAS.filter(e => (S.data[e.id]||{}).top?.length).length} eras. Only three make it.</p></div>

  <div class="grid" id="grid">${ERAS.map(e => ((S.data[e.id]||{}).top||[]).map((id,i) => chipHtml(id, `${e.name} #${i+1}`)).join("")).join("")}</div>`;
}
function dock(){
  const top = list(), all = S.mode === "all";
  if (all && pool().length < 2) return "";
  let label, dis = "";
  if (all){ label = "See summary"; if (top.length < need()) dis = "disabled"; }
  else label = isLast() ? "Pick all-time top 3" : top.length ? "Next era" : "Skip era";
  return `<div class="go"><div class="go-in">
    <div class="dock-slots">${[0,1,2].map(i => top[i] ? `<span class="on"><i>${i+1}</i>${esc(GAME[top[i]].t)}</span>` : `<span><i>${i+1}</i>—</span>`).join("")}</div>
    <button class="btn" data-act="next" ${dis}>${label}</button></div></div>`;
}
function refresh(){
  const top = list();
  $("#slots").innerHTML = slots();
  document.querySelectorAll("#grid .chip").forEach(c => { const r = top.indexOf(c.dataset.pick) + 1; c.setAttribute("aria-pressed", r>0); c.dataset.rank = r || ""; });
  $("#dock").innerHTML = dock();
  if (S.mode === "rank") renderRail();
  save();
}

function summaryText(){
  const at = S.allTime.length ? "ALL-TIME TOP 3\n" + S.allTime.map((id,i) => `${i+1}. ${GAME[id].t}`).join("\n") + "\n\n" : "";
  return "My top 3 games by era\n\n" + at + ERAS.map(e => { const t = (S.data[e.id]||{}).top || [];
    return `${e.name} (${e.years})\n` + (t.length ? t.map((id,i) => `${i+1}. ${GAME[id].t}`).join("\n") : "Not ranked yet"); }).join("\n\n");
}
function viewSummary(){
  const done = ERAS.filter(e => (S.data[e.id]||{}).top?.length).length, at = S.allTime;
  const allCard = at.length
    ? `<section class="card big" style="--c:${ALL_C}"><span class="yrs"><span class="era-n">All time</span></span>
       <h3><b>1</b>${esc(GAME[at[0]].t)}<small>${metaAll(at[0])}</small></h3>

    : `<section class="card big" style="--c:${ALL_C}"><span class="yrs"><span class="era-n">All time</span></span>
       <p class="none">Not picked yet.</p>${SHARED ? "" : `<button class="btn alt" data-mode="all">Pick your all-time top 3</button>`}</section>`;
  return `${SHARED ? `<p class="banner">You’re looking at someone’s shared picks. Nothing here is saved to your browser.</p>` : ""}
  <div class="era-head"><h2 style="color:var(--ink)">${SHARED ? "Shared picks" : "Your picks"}</h2><p>${done} of ${ERAS.length} eras ranked.</p></div>
  <div class="sum">${allCard}${ERAS.map(e => { const t = (S.data[e.id]||{}).top || [];
    return `<section class="card" style="--c:${e.c}"><span class="yrs"><span class="era-n">${e.name}</span>, ${e.years}</span>
    ${t.length ? `<h3><b>1</b>${esc(GAME[t[0]].t)}</h3><ol>${t.slice(1).map((id,i) => `<li><b>${i+2}</b>${esc(GAME[id].t)}</li>`).join("")}</ol>`
      : `<p class="none">Not ranked yet.</p>${SHARED ? "" : `<button class="btn alt" data-goto="${e.id}">Rank this era</button>`}`}</section>`; }).join("")}</div>
  ${SHARED
    ? `<div class="row"><button class="btn" data-act="mine">Make my own picks</button></div>`
    : `<div class="row"><button class="btn" data-act="link" ${done?"":"disabled"}>Copy share link</button>
       <button class="btn alt" data-act="copy" ${done?"":"disabled"}>Copy as text</button>
       <button class="btn alt" data-goto="arcade">Edit era picks</button></div>`}
  <div id="copyout"></div>`;

const b64u   = str => { let b=""; new TextEncoder().encode(str).forEach(c => b += String.fromCharCode(c));
                        return btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const unb64u = str => new TextDecoder().decode(
                        Uint8Array.from(atob(str.replace(/-/g,"+").replace(/_/g,"/")), c => c.charCodeAt(0)));

function pack(){
  const d = [], w = [];
  ERAS.forEach(e => {
    const cust = S.custom[e.id] || [], used = [];
    d.push(((S.data[e.id]||{}).top || []).map(id => {
      if (!id.startsWith("wi-")) return +id.slice(e.id.length + 1);
      const g = cust.find(x => x.id === id); if (!g) return null;
      let k = used.indexOf(g); if (k < 0) k = used.push(g) - 1;
      return "w" + k;
    }).filter(v => v !== null));
    w.push(used.map(g => [g.t, g.y || 0]));
  });
  const a = S.allTime.map(id => {
    const e = eraOf(id); if (!e) return null;
    const pos = ((S.data[e.id]||{}).top || []).indexOf(id);
    return pos < 0 ? null : [ERAS.indexOf(e), pos];
  }).filter(Boolean);
  return {v:1, d, w, a};
}
function unpack(o){
  const st = {era:ERAS[0].id, mode:"summary", data:{}, custom:{}, allTime:[]};
  (o.d || []).forEach((top, ei) => {
    const e = ERAS[ei]; if (!e || !Array.isArray(top)) return;
    const wl = (o.w || [])[ei] || [];
    const ids = top.map(v => {
      if (typeof v === "string" && v[0] === "w"){
        const src = wl[+v.slice(1)]; if (!src) return null;
        const id = "sw-" + ei + "-" + v.slice(1);
        GAME[id] = {t:String(src[0]).slice(0,80), y:+src[1] || null, p:"Write-in", wi:true};
        return id;
      }
      const id = e.id + "-" + v; return GAME[id] ? id : null;
    }).filter(Boolean).slice(0,3);
    if (ids.length) st.data[e.id] = {top:ids};
  });
  st.allTime = (o.a || []).map(v => {
    const e = ERAS[(v||[])[0]]; if (!e) return null;
    return ((st.data[e.id]||{}).top || [])[v[1]] || null;
  }).filter(Boolean).slice(0,3);
  return st;
}
const shareUrl = () => location.origin + location.pathname + "#s=" + b64u(JSON.stringify(pack()));
function offer(txt, ok){
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(() => toast(ok))
    .catch(() => { $("#copyout").innerHTML = `<textarea readonly aria-label="Copy this">${esc(txt)}</textarea>`;
                   toast("Select the text below to copy it."); });
}

function render(){
  const p = new Set(pool()); S.allTime = S.allTime.filter(id => p.has(id));
  document.documentElement.style.setProperty("--era", S.mode === "summary" ? "#7A7F8F" : S.mode === "all" ? ALL_C : era().c);
  document.querySelector(".modes").style.display = SHARED ? "none" : "";
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
  $("#rail").style.display = S.mode === "rank" ? "" : "none";
  if (S.mode === "rank") renderRail();
  $("#main").innerHTML = S.mode === "summary" ? viewSummary() : S.mode === "all" ? viewAll() : viewRank();
  $("#dock").innerHTML = S.mode === "summary" ? "" : dock();
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t || t.form) return;
  if (t.dataset.mode){ S.mode = t.dataset.mode; save(); render(); window.scrollTo({top:0}); return; }
  if (t.dataset.era){ S.era = t.dataset.era; save(); render(); return; }
  if (t.dataset.goto){ S.era = t.dataset.goto; S.mode = "rank"; save(); render(); window.scrollTo({top:0}); return; }
  const top = list().slice();
  if (t.dataset.pick){
    const id = t.dataset.pick;
    if (top.includes(id)) setList(top.filter(x => x !== id));
    else if (top.length >= 3) return toast("You’ve picked 3. Remove one to swap it out.");
    else setList(top.concat(id));
    return refresh();
  }
  const i = +t.dataset.i;
  switch (t.dataset.act){
    case "up": [top[i-1], top[i]] = [top[i], top[i-1]]; setList(top); return refresh();
    case "down": [top[i+1], top[i]] = [top[i], top[i+1]]; setList(top); return refresh();
    case "remove": top.splice(i,1); setList(top); return refresh();
    case "next": {
      if (S.mode === "all") S.mode = "summary";
      else if (isLast()) S.mode = "all";
      else S.era = ERAS[ERAS.indexOf(era())+1].id;
      save(); render(); window.scrollTo({top:0}); return;
    }
    case "copy": offer(summaryText(), "Picks copied as text."); return;
    case "link": offer(shareUrl(), "Share link copied."); return;
    case "mine": {
      SHARED = false; S = MINE || S; S.mode = "summary";
      history.replaceState(null, "", location.pathname + location.search);
      render(); window.scrollTo({top:0}); return;
    }
  }
});

document.addEventListener("input", ev => {
  if (ev.target.id !== "q") return;
  const q = ev.target.value.trim().toLowerCase();
  document.querySelectorAll("#grid .chip").forEach(c => c.hidden = q && !c.textContent.toLowerCase().includes(q));
});

document.addEventListener("submit", ev => {
  if (ev.target.id !== "wi") return;
  ev.preventDefault();
  const f = ev.target, t = f.t.value.trim(), y = parseInt(f.y.value, 10);
  if (!t) return;
  const e = era(), lst = S.custom[e.id] || (S.custom[e.id] = []);
  const id = "wi-" + e.id + "-" + Date.now().toString(36);
  const g = {id, t, y: y >= 1950 && y <= 2100 ? y : null};
  lst.push(g); GAME[id] = {t, y:g.y, p:"Write-in", wi:true};
  const d = D(), added = d.top.length < 3;
  if (added) d.top.push(id);
  save(); render();
  toast(added ? `Added ${t} as your #${d.top.length}.` : `Added ${t}. Remove a pick to rank it.`);
});

const hash = /[#&]s=([A-Za-z0-9_-]+)/.exec(location.hash || "");
if (hash){
  try {
    const o = JSON.parse(unb64u(hash[1]));
    if (o && o.v === 1){ MINE = S; S = unpack(o); SHARED = true; }
  } catch(e){ /* a mangled link just falls through to your own picks */ }
}
window.addEventListener("hashchange", () => location.reload());

render();
</script>
</body>
</html>
